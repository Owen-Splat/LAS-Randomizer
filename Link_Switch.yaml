# Link's Awakening (Switch) — full Archipelago configuration
# This file is used by AP generation. Its settings are carried by the .lasap
# into LAS Randomizer; LAS does not perform a second shuffle.
name: LinkPlayer
game: "Link's Awakening (Switch)"
Link's Awakening (Switch):
  accessibility: full
  check_profile: configured

  # Main checks
  chests: true
  golden_leaves: true
  miscellaneous: true
  free_gifts: true
  heart_pieces: true
  seashell_mansion: 50  # 0, 5, 15, 30, 40 or 50: highest randomized reward tier
  trade_quest: true
  seashells: true
  shop: true

  # Minigames
  dampe: true
  rapids: true
  fishing: true
  trendy_game: true

  # Dungeons
  blupsanity: false
  boss_drops: true
  instruments: true
  owl_gifts: none  # none, overworld, dungeons or all

  # World
  randomize_enemies: false
  randomize_enemy_sizes: false
  chest_appearance: default  # default, size or texture_and_size
  open_kanalet: true
  open_mabe: false
  open_mamu: true
  completed_bridge: true
  classic_d2: false
  shuffled_dungeons: false
  extra_consumable_drop: true

  # Logic
  bad_pets: false
  free_book: true
  fast_fishing: false
  fast_stalfos: false
  unlocked_bombs: true
  shuffled_bombs: false
  shuffled_powder: false

  # Cosmetics and nice items
  blur_removal: false
  randomize_music: false
  nice_bombs: false
  nice_magic_rod: false
  sword_beam_with_lv1: false

  # Speed options: true enables the faster version
  fast_boss_cutscenes: false
  fast_song_cutscenes: false
  fast_chest_animations: false
  fast_key_animations: false

  # Shop and item pool
  fast_stealing: false
  stealing: normal  # always, never or normal
  traps: none  # none, few, several, many or insanity

  # Other
  one_hit_ko: false
  death_link: false

  # Quantities are removed from your selected shuffled item pool. AP delivers
  # them once using normal saved receipts. Keep these types in randomized_items.
  # Example: starting_items: {sword: 1, shield: 1, bracelet: 2}
  starting_items: {}

